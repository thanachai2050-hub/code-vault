<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>คลังโค้ด</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#10242b">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--ink:#10242b;--paper:#f2f5f1;--card:#fff;--line:#d3dcd7;--amber:#f2b632;--mut:#5b6b66;--red:#b3261e}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font:16px/1.55 "Noto Sans Thai","Sarabun",system-ui,sans-serif;background:var(--paper);color:var(--ink);padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:1.7rem;line-height:1.25;margin:14px 0 4px}
p{margin:6px 0 14px}
.mut{color:var(--mut)}
.empty{padding:18px;border:1.5px dashed var(--line);border-radius:12px;color:var(--mut)}
.btn{min-height:46px;padding:0 18px;border:0;border-radius:10px;font:inherit;font-weight:600;background:var(--ink);color:#fff;cursor:pointer}
.btn:disabled{opacity:.4}
.go{background:var(--amber);color:var(--ink)}
.ghost{background:transparent;border:1.5px solid var(--ink);color:var(--ink)}
.danger{color:var(--red);border-color:var(--red)}
.row{display:flex;flex-wrap:wrap;gap:10px;margin:16px 0}
.item{display:flex;width:100%;justify-content:space-between;align-items:center;min-height:56px;margin:0 0 10px;padding:0 16px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);font:inherit;color:inherit;text-align:left}
.item span{color:var(--mut);font-size:.9rem}
select{width:100%;min-height:46px;margin:4px 0 12px;padding:0 10px;font:inherit;border:1.5px solid var(--line);border-radius:10px;background:var(--card)}
ul{list-style:none;margin:0;padding:0}
li{display:flex;align-items:center;gap:10px;min-height:48px;border-bottom:1px solid var(--line)}
li span{flex:1;word-break:break-all}
li small{color:var(--mut)}
.x{min-height:40px;padding:0 12px;border:0;background:none;color:var(--red);font:inherit}
.bar{display:flex;align-items:center;gap:12px;margin-bottom:10px}
#st{color:var(--mut);font-size:.9rem;flex:1}
#term{height:calc(100dvh - 190px);min-height:240px;margin:0;padding:12px;overflow:auto;border-radius:12px;background:var(--ink);color:#e8f1ee;font:13px/1.45 ui-monospace,"Noto Sans Mono","Noto Sans Thai",monospace;white-space:pre-wrap;word-break:break-word}
#inrow{display:flex;gap:8px;margin-top:10px}
#inrow[hidden]{display:none}
#line{flex:1;min-width:0;min-height:46px;padding:0 12px;font:16px ui-monospace,monospace;border:2px solid var(--amber);border-radius:10px;background:var(--card);color:var(--ink)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
</style>
</head>
<body>
<main id="app"></main>

<!-- Worker source: browser ignores this script type -->
<script type="text/js-worker" id="ws">
var PY = 'https://cdn.jsdelivr.net/pyodide/v0.27.0/full/';
importScripts(PY + 'pyodide.js');

var ctrl, data8, py;
var dec = new TextDecoder();

self.sleepSync = function(ms) {
  if (ms > 0) {
    var tmp = new Int32Array(new SharedArrayBuffer(4));
    Atomics.wait(tmp, 0, 0, ms);
  }
};

self.onmessage = async function(e) {
  var m = e.data;

  if (m.t === 'init') {
    ctrl = new Int32Array(m.sab, 0, 2);
    data8 = new Uint8Array(m.sab, 8);
    try {
      py = await loadPyodide({indexURL: PY});
      py.setStdout({write: function(b){ postMessage({t:'o', b:b}); return b.length; }});
      py.setStderr({write: function(b){ postMessage({t:'o', b:b}); return b.length; }});
      py.setStdin({stdin: function() {
        Atomics.store(ctrl, 0, 0);
        postMessage({t:'ask'});
        Atomics.wait(ctrl, 0, 0);
        var n = Atomics.load(ctrl, 1);
        return dec.decode(data8.slice(0, n));
      }});
      py.runPython(
        'import os,sys,time,js\n' +
        'def _sys(c):\n' +
        '    if str(c).strip() in ("clear","cls"): sys.stdout.write("\\x1b[2J")\n' +
        '    return 0\n' +
        'os.system = _sys\n' +
        'time.sleep = lambda s: js.sleepSync(int(s*1000))'
      );
      postMessage({t:'rdy'});
    } catch(err) { postMessage({t:'err', msg:String(err)}); }
  }

  if (m.t === 'run') {
    try {
      py.runPython(
        'import shutil,os,sys\n' +
        'shutil.rmtree("/proj",ignore_errors=True)\n' +
        'os.makedirs("/proj")\n' +
        'if "/proj" not in sys.path: sys.path.insert(0,"/proj")\n' +
        'for k in [k for k,v in list(sys.modules.items()) if str(getattr(v,"__file__","") or "").startswith("/proj")]: del sys.modules[k]'
      );
      var files = m.files;
      Object.keys(files).forEach(function(n){ py.FS.writeFile('/proj/'+n, files[n]); });
      await py.runPythonAsync('import runpy\nrunpy.run_path("/proj/'+m.entry+'",run_name="__main__")');
      postMessage({t:'done'});
    } catch(err) {
      var msg = String(err.message || err);
      var isExit = /SystemExit/.test(msg.trim().split('\n').pop());
      postMessage({t: isExit ? 'done' : 'err', msg: msg});
    }
  }
};
</script>

<script>
var $ = function(s){ return document.querySelector(s); };
var esc = function(s){ return String(s).replace(/[&<>"]/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]);}); };
var app = $('#app');

var db = [];
try{ db = JSON.parse(localStorage.getItem('cv.projects')||'[]'); }catch(e){}
var save = function(){ try{ localStorage.setItem('cv.projects',JSON.stringify(db)); }catch(e){ alert('พื้นที่เก็บเต็ม'); } };
var cur = null, running = false;
var P = function(){ return db.find(function(x){ return x.id===cur; }); };

function home(){
  cur=null;
  app.innerHTML='<h1>คลังโค้ด</h1><p class="mut">โปรเจค Python ของคุณ เก็บและรันได้ในเครื่องนี้</p>'+
  (db.length ? db.map(function(p){ return '<button class="item" data-open="'+p.id+'"><b>'+esc(p.name)+'</b><span>'+Object.keys(p.files).length+' ไฟล์</span></button>'; }).join('') :
  '<p class="empty">ยังไม่มีโปรเจค กด "โปรเจคใหม่" แล้วเพิ่มไฟล์ .py ของคุณ</p>')+
  '<div class="row"><button class="btn go" data-a="new">โปรเจคใหม่</button></div>';
}

function proj(id){
  cur=id; var p=P(), names=Object.keys(p.files);
  if(!p.entry||!p.files[p.entry]) p.entry=names.includes('main.py')?'main.py':(names[0]||'');
  app.innerHTML='<button class="btn ghost" data-a="home">กลับ</button><h1>'+esc(p.name)+'</h1>'+
  (names.length ?
    '<label class="mut" for="entry">ไฟล์เริ่มต้นที่จะรัน</label><select id="entry">'+names.map(function(n){ return '<option '+(n===p.entry?'selected':'')+'>'+esc(n)+'</option>'; }).join('')+'</select>'+
    '<ul>'+names.map(function(n){ return '<li><span>'+esc(n)+'</span><small>'+(p.files[n].length/1024).toFixed(1)+' KB</small><button class="x" data-del="'+esc(n)+'">ลบ</button></li>'; }).join('')+'</ul>' :
    '<p class="empty">ยังไม่มีไฟล์ กด "เพิ่มไฟล์ .py" แล้วเลือกไฟล์จากเครื่อง</p>')+
  '<input type="file" id="pick" multiple hidden>'+
  '<div class="row"><button class="btn go" data-a="run"'+(names.length?'':' disabled')+'>รัน</button><button class="btn ghost" data-a="add">เพิ่มไฟล์ .py</button><button class="btn ghost danger" data-a="rm">ลบโปรเจค</button></div>';
}

/* ---- Terminal ---- */
var lines=[], tcur='', raf=0;
function draw(){ raf=0; var t=$('#term'); if(!t)return; t.textContent=lines.join('\n')+(lines.length?'\n':'')+tcur; t.scrollTop=t.scrollHeight; }
function tw(s){
  s.replace(/\r\n/g,'\n').split(/(\x1b\[2J|\x1b\[H|\n|\r)/).forEach(function(p){
    if(p==='\n'){ lines.push(tcur); tcur=''; }
    else if(p==='\r'){ tcur=''; }
    else if(p==='\x1b[2J'){ lines=[]; tcur=''; }
    else if(p!=='\x1b[H') tcur+=p;
  });
  if(lines.length>600) lines=lines.slice(-500);
  if(!raf) raf=requestAnimationFrame(draw);
}
var st = function(t){ var e=$('#st'); if(e) e.textContent=t; };

/* ---- Worker + SharedArrayBuffer ---- */
var worker=null, sab=null, ctrl=null, data8=null, workerReady=false;
var enc=new TextEncoder(), dec=new TextDecoder();

function hasSAB(){ try{ new SharedArrayBuffer(4); return true; }catch(e){ return false; } }

function setupWorker(){
  if(worker) return;
  sab = new SharedArrayBuffer(8+4096);
  ctrl = new Int32Array(sab, 0, 2);
  data8 = new Uint8Array(sab, 8);
  var src = document.getElementById('ws').textContent;
  var blob = new Blob([src], {type:'application/javascript'});
  worker = new Worker(URL.createObjectURL(blob));
  worker.postMessage({t:'init', sab:sab});
}

function submitInput(val){
  var bytes = enc.encode(val+'\n');
  var n = Math.min(bytes.length, 4096);
  data8.set(bytes.subarray(0,n));
  Atomics.store(ctrl, 1, n);
  Atomics.store(ctrl, 0, 1);
  Atomics.notify(ctrl, 0);
}

function doSubmit(){
  var v=$('#line'); if(!v)return;
  var val=v.value;
  var r=$('#inrow'); if(r) r.hidden=true;
  tw(val+'\n');
  submitInput(val);
  v.value='';
}

/* ---- Run ---- */
function run(){
  var p=P();
  app.innerHTML='<div class="bar"><button class="btn ghost" data-a="back">กลับ</button><span id="st"></span></div><pre id="term"></pre>'+
  '<div id="inrow" hidden><input id="line" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="send" placeholder="พิมพ์ตอบที่นี่..."><button class="btn go" id="send">ส่ง</button></div>';
  lines=[]; tcur=''; running=true;

  if(!hasSAB()){
    tw('ไม่สามารถรันได้: กรุณาเปิดในแอปแล้วลองใหม่\nหรือเปิดใน Chrome เวอร์ชันล่าสุด\n');
    st('ผิดพลาด'); running=false; return;
  }

  st('กำลังโหลด Python...');
  setupWorker();

  worker.onmessage = function(e){
    var m = e.data;
    if(m.t==='o'){ tw(dec.decode(m.b, {stream:true})); }
    if(m.t==='ask'){
      var r=$('#inrow'); if(r){ r.hidden=false; var l=$('#line'); if(l) l.focus(); }
    }
    if(m.t==='rdy'){
      workerReady=true;
      st('กำลังรัน '+p.entry);
      worker.postMessage({t:'run', files:p.files, entry:p.entry||'main.py'});
    }
    if(m.t==='done'){
      tw('\n[โปรแกรมจบการทำงาน]\n');
      running=false; st('จบแล้ว');
      var r=$('#inrow'); if(r) r.hidden=true;
    }
    if(m.t==='err'){
      tw('\n'+m.msg+'\n[โปรแกรมจบการทำงาน]\n');
      running=false; st('จบแล้ว');
      var r=$('#inrow'); if(r) r.hidden=true;
    }
  };

  if(workerReady){
    st('กำลังรัน '+p.entry);
    worker.postMessage({t:'run', files:p.files, entry:p.entry||'main.py'});
  }
}

/* ---- Events ---- */
app.addEventListener('click', function(e){
  var b=e.target.closest('button'); if(!b)return;
  var d=b.dataset;
  if(d.open) return proj(d.open);
  if(d.del){ if(confirm('ลบไฟล์ '+d.del+' ?')){ delete P().files[d.del]; save(); proj(cur); } return; }
  if(b.id==='send') return doSubmit();
  switch(d.a){
    case 'home': return home();
    case 'new': {
      var n=(prompt('ชื่อโปรเจค')||'').trim();
      if(!n)return;
      var p={id:String(Date.now()),name:n,files:{},entry:''};
      db.push(p); save(); return proj(p.id);
    }
    case 'add': return $('#pick').click();
    case 'run': return run();
    case 'rm':
      if(confirm('ลบโปรเจคนี้ทั้งหมด?')){ db=db.filter(function(x){return x.id!==cur;}); save(); home(); }
      return;
    case 'back':
      if(running && worker){ worker.terminate(); worker=null; workerReady=false; }
      return proj(cur);
  }
});

app.addEventListener('change', async function(e){
  if(e.target.id==='pick'){ var p=P(); for(var f of e.target.files) p.files[f.name]=await f.text(); save(); proj(cur); }
  if(e.target.id==='entry'){ P().entry=e.target.value; save(); }
});

app.addEventListener('keydown', function(e){
  if(e.key==='Enter' && e.target.id==='line'){ e.preventDefault(); doSubmit(); }
});

home();
if('serviceWorker' in navigator && location.protocol.startsWith('http'))
  navigator.serviceWorker.register('sw.js').catch(function(){});
</script>
</body>
</html>
